name: Envio Automatico de Alertas Semanales

on:
  schedule:
    # Se ejecuta todos los lunes a las 08:00 AM hora de Chile (11:00 UTC)
    - cron: '0 11 * * 1'
  workflow_dispatch: # Permite probar el envío de forma manual desde GitHub en cualquier momento

jobs:
  enviar_correo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          pip install supabase pandas

      - name: Ejecutar script de envio de correos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python enviar_alertas.py